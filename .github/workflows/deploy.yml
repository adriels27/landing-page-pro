name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/landing-repo/landing:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/landing-repo/landing:${{ github.sha }}

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy landing-service \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/landing-repo/landing:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --port 80 \
            --allow-unauthenticated